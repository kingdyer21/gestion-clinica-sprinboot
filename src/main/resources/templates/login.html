<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{login.titulo}">Login - Sistema de Turnos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-container {
            max-width: 400px;
            margin: 0 auto;
            padding: 30px;
            background: #EFB810;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), 0 0 10px gold;
        }
        .btn-primary.w-100 {
            background-color: gold !important;
            color: black !important;
            border-color: gold !important;
        }
        .btn-primary.w-100:hover {
            background-color: #DAA520 !important;
            border-color: #DAA520 !important;
        }
        .btn-primary.w-100:active {
            background-color: #B8860B !important;
            border-color: #B8860B !important;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="login-container">
        <h2 class="text-center mb-4" th:text="#{login.titulo}">Iniciar Sesión</h2>

        <div th:if="${param.error}" class="alert alert-danger" th:text="#{login.error}">
            Usuario o contraseña incorrectos
        </div>

        <div th:if="${param.logout}" class="alert alert-success" th:text="#{login.logout}">
            Has cerrado sesión exitosamente
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label" th:text="#{login.usuario}">Usuario:</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label" th:text="#{login.contraseña}">Contraseña:</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100" th:text="#{login.boton}">Ingresar</button>
        </form>

        <!-- Selector de idioma -->
        <div class="mt-3 text-center">
            <a href="?lang=es">Español</a> | <a href="?lang=en">English</a>
        </div>
    </div>
</div>
</body>
</html>
