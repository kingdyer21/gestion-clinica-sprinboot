# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8080
server.servlet.session.timeout=15m
server.error.whitelabel.enabled=false

# ===============================
# SESSION SECURITY CONFIGURATION
# ===============================
# Proteccion XSS (los comentarios deben ir en lineas separadas)
server.servlet.session.cookie.http-only=true
# Solo habilitar secure en produccion con HTTPS
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.name=APP_SESSION
server.servlet.session.tracking-modes=COOKIE

# ===============================
# DATABASE CONFIGURATION (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/turnosdb?useSSL=false&serverTimezone=UTC&autoReconnect=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA/HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# THYMELEAF (Template Engine)
# ===============================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

